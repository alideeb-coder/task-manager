$kind: http-request
description: |-
  Returns a paginated list of tasks belonging to the currently authenticated user. Requires a valid Sanctum token.

  Optional query parameters:

  - ?status=0|1 → Filter tasks by completion status (0 = incomplete, 1 = complete).
      
  - ?search=word → Filter tasks whose title contains the given word.
      
  - ?page=N → Pagination page number (defaults to 1).
      

  Both filters can be combined (e.g., ?status=0&search=meeting). Returns 200 with a paginated JSON response.
